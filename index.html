<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-10 font-sans min-h-screen relative">
    <div class="max-w-5xl mx-auto">
        
        <header class="mb-10 flex justify-between items-end border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-4xl font-extrabold text-blue-400 tracking-tight">Event Manager</h1>
                <p class="text-gray-400 mt-2">Plataforma de gestão e controle de inscrições</p>
            </div>
            <button onclick="toggleModal('modal-create-event')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-6 rounded-xl shadow-lg shadow-emerald-900/20 transition-colors">
                + Novo Evento
            </button>
        </header>

        <!-- Grid de Eventos -->
        <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    </div>

    <!-- Modal: Criar Evento -->
    <div id="modal-create-event" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-gray-800 rounded-2xl p-8 w-full max-w-md border border-gray-700 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-white">Criar Novo Evento</h2>
            <form id="form-create" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Título do Evento</label>
                    <input type="text" id="ev-title" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Data e Hora</label>
                    <input type="datetime-local" id="ev-date" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Capacidade de Vagas</label>
                    <input type="number" id="ev-capacity" min="1" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="toggleModal('modal-create-event')" class="px-4 py-2 text-gray-400 hover:text-white transition">Cancelar</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-semibold transition">Salvar Evento</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Inscrição -->
    <div id="modal-register" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-gray-800 rounded-2xl p-8 w-full max-w-md border border-gray-700 shadow-2xl">
            <h2 class="text-2xl font-bold mb-2 text-white">Garantir Vaga</h2>
            <p id="reg-event-title" class="text-blue-400 text-sm mb-6 font-medium"></p>
            
            <form id="form-register" class="space-y-4">
                <input type="hidden" id="reg-event-id">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Nome Completo</label>
                    <input type="text" id="reg-name" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">E-mail</label>
                    <input type="email" id="reg-email" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="toggleModal('modal-register')" class="px-4 py-2 text-gray-400 hover:text-white transition">Cancelar</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-semibold transition">Confirmar Inscrição</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        // Carrega os eventos ao iniciar
        async function loadEvents() {
            try {
                const response = await fetch(`${API_URL}/events`);
                const events = await response.json();
                const grid = document.getElementById('events-grid');
                grid.innerHTML = '';

                events.forEach(event => {
                    const date = new Date(event.date).toLocaleDateString('pt-BR', { 
                        weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                    const isFull = event.registrationCount >= event.capacity;
                    
                    grid.innerHTML += `
                        <div class="bg-gray-800 rounded-2xl p-6 shadow-xl border border-gray-700 transition flex flex-col justify-between h-full">
                            <div>
                                <h2 class="text-xl font-bold mb-2 text-white">${event.title}</h2>
                                <p class="text-gray-400 text-sm mb-5 capitalize">📅 ${date}</p>
                            </div>
                            
                            <div>
                                <div class="flex justify-between items-center mb-4">
                                    <span class="text-sm font-medium bg-gray-700/50 px-3 py-1 rounded-full border border-gray-600">
                                        Vagas: <span class="${isFull ? 'text-red-400' : 'text-blue-400'}">${event.registrationCount}</span> / ${event.capacity}
                                    </span>
                                </div>
                                
                                <button onclick="openRegisterModal(${event.id}, '${event.title}')" class="w-full font-semibold py-2.5 rounded-xl transition-colors ${
                                    isFull 
                                    ? 'bg-red-900/40 text-red-400 cursor-not-allowed border border-red-900/50' 
                                    : 'bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/20'
                                }" ${isFull ? 'disabled' : ''}>
                                    ${isFull ? 'Lotação Máxima' : 'Inscrever-se'}
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error(error);
                alert('Erro ao carregar eventos. O servidor está ligado?');
            }
        }

        // Funções de Interface
        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.toggle('hidden');
        }

        function openRegisterModal(eventId, eventTitle) {
            document.getElementById('reg-event-id').value = eventId;
            document.getElementById('reg-event-title').innerText = eventTitle;
            toggleModal('modal-register');
        }

        // POST: Criar Evento
        document.getElementById('form-create').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                title: document.getElementById('ev-title').value,
                date: new Date(document.getElementById('ev-date').value).toISOString(),
                capacity: parseInt(document.getElementById('ev-capacity').value)
            };

            const res = await fetch(`${API_URL}/events`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                toggleModal('modal-create-event');
                document.getElementById('form-create').reset();
                loadEvents(); // Recarrega a tela
            } else {
                const err = await res.json();
                alert(`Erro: ${err.error}`);
            }
        });

        // POST: Registrar Participante
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const eventId = document.getElementById('reg-event-id').value;
            const body = {
                participantName: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value
            };

            const res = await fetch(`${API_URL}/events/${eventId}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                toggleModal('modal-register');
                document.getElementById('form-register').reset();
                loadEvents(); // Recarrega a tela para atualizar o número de vagas
            } else {
                const err = await res.json();
                alert(`Aviso: ${err.error}`);
            }
        });

        loadEvents();
    </script>
</body>
</html>
